version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fedai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fedai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fedai_password}
      POSTGRES_DB: ${POSTGRES_DB:-fedai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: fedai_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fedai_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
